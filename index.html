<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Fixer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 20px; }
    .box { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
    h1 { text-align: center; color: #333; }
    select, textarea, button { width: 100%; margin-top: 12px; padding: 10px; font-size: 16px; box-sizing: border-box; }
    textarea { height: 250px; font-family: monospace; }
    button { background: #4a6cf7; color: white; border: none; border-radius: 8px; }
    #result { margin-top: 16px; padding: 12px; background: #eef1ff; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Code Fixer</h1>
    <p>Paste your code and find your mistakes.</p>
    <select id="language">
      <option>C++</option>
      <option>Java</option>
      <option>Python</option>
    </select>
    <textarea id="code" placeholder="Paste your code here..."></textarea>
    <button id="btn" onclick="checkCode()">Check Code</button>
